name: Build BetopToXInput

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'   # 如果项目是 net8.0-windows，改成 '8.0.x'

      - name: 还原依赖
        run: dotnet restore .BetopToXInput-main/src/BetopToXInput.App/BetopToXInput.App.csproj

      - name: 发布单文件 exe
        run: >
          dotnet publish .BetopToXInput-main/src/BetopToXInput.App/BetopToXInput.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableWindowsTargeting=true
          -o ./publish

      - name: 上传编译结果
        uses: actions/upload-artifact@v4
        with:
          name: BetopToXInput.App
          path: ./publish
