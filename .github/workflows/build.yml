name: Build BetopToXInput

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v5          # 从 v4 升级到 v5

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v5     # 从 v4 升级到 v5
        with:
          dotnet-version: '10.0.x'        # 根据你的项目实际版本修改

      - name: 还原依赖
        run: dotnet restore .BetopToXInput/BetopToXInput-main/src/BetopToXInput.App/BetopToXInput.App.csproj

      - name: 发布单文件 exe
        run: >
          dotnet publish .BetopToXInput/BetopToXInput-main/src/BetopToXInput.App/BetopToXInput.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableWindowsTargeting=true
          -o ./publish

      - name: 上传编译结果
        uses: actions/upload-artifact@v4
        with:
          name: BetopToXInput.App
          path: ./publish
