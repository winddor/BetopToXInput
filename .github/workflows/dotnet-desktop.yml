name: Build BetopToXInput
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore ./BetopToXInput.App/BetopToXInput.App.csproj
      - run: dotnet publish ./BetopToXInput.App/BetopToXInput.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableWindowsTargeting=true -o ./publish
      - uses: actions/upload-artifact@v4
        with:
          name: BetopToXInput.App
          path: ./publish
